name: crohns_experience
description: "Crohn's Experience - A comprehensive digital health platform for Crohn's disease management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  
  # State Management
  provider: ^6.1.2
  
  # Local Storage
  shared_preferences: ^2.3.4
  
  # Date/Time
  intl: ^0.19.0
  
  # Charts for Analytics
  fl_chart: ^0.70.2
  
  # Video Recording
  camera: ^0.11.1
  video_player: ^2.9.3
  
  # Image Picker
  image_picker: ^1.1.2
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # UUID Generation
  uuid: ^4.5.1
  
  # Encryption
  encrypt: ^5.0.3
  
  # Path Provider
  path_provider: ^2.1.5
  
  # Permission Handler
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
